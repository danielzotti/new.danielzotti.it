version: "3"

services:
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - configuration=${CONFIGURATION}
        - GITHUB_ACCESS_TOKEN=${GITHUB_ACCESS_TOKEN}
    container_name: danielzotti-next_${CONFIGURATION}
    image: dz/danielzotti-next_${CONFIGURATION}
    expose:
      - 3000
    restart: unless-stopped
